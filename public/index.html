<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYTE BACK | 로그인 자료실</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101a28;color:#ecf4ff}main{max-width:760px;margin:auto;padding:40px 22px}h1{font-size:36px}.eyebrow{color:#8ad8df}p{line-height:1.7;color:#bfd0e5}form,article{padding:20px;background:#1a2a3d;border:1px solid #51667c;border-radius:14px;margin:16px 0}label{display:block;margin:12px 0}input,textarea{box-sizing:border-box;display:block;width:100%;padding:12px;background:#101a28;color:inherit;border:1px solid #51667c;border-radius:8px}textarea{min-height:100px}button{padding:11px 15px;margin:6px 6px 6px 0;border:0;border-radius:8px;background:#2dd4bf;color:#09242a;cursor:pointer}button.secondary{background:#33465d;color:#fff}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}#status{min-height:24px;white-space:pre-wrap}article p{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body><main>
<div class="eyebrow">BYTE BACK · 4단계 내 자료만</div><h1>최부장의 자료실</h1>
<p>로그인한 뒤 실습용 가상 메모를 관리하세요. 실제 개인정보나 비밀값을 넣지 마세요.</p>
<div id="status" role="status" aria-live="polite"></div>
<form id="login-form"><h2>로그인</h2><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button><button type="button" id="signup" class="secondary">계정 만들기</button><p>새 계정은 이메일 인증을 완료한 뒤 로그인하세요.</p></form>
<section id="vault" hidden><p id="account">로그인됨</p><button id="logout" class="secondary">로그아웃</button><button id="refresh" class="secondary">목록 새로고침</button>
<form id="note-form"><h2 id="form-heading">메모 추가</h2><label>제목<input id="title" maxlength="200" required></label><label>내용<textarea id="body" maxlength="10000"></textarea></label><button type="submit">저장</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button></form>
<div id="notes"></div></section>
</main></body></html>
